name: Request Codex review for main PR

on:
  # Only trusted workflow code runs. No PR code is checked out or executed.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize, edited]
  # Promotion calls this directly, without relying on events from GITHUB_TOKEN.
  workflow_call:
    inputs:
      pr_number:
        description: Main pull request number
        required: true
        type: string
    secrets:
      CODEX_REVIEW_TOKEN:
        description: Fine-grained PR-write token for the human account connected to Codex
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-main-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Codex review credential
        env:
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        run: |
          if [ -z "$CODEX_REVIEW_TOKEN" ]; then
            echo "::error::Set the CODEX_REVIEW_TOKEN repository secret to a fine-grained token for the human GitHub account connected to Codex (TOKAI2 only; Pull requests read/write). GITHUB_TOKEN bot comments do not start Codex reviews."
            exit 1
          fi
      - name: Request one Codex review per head commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0 (Node.js 24)
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.CODEX_REVIEW_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const input = process.env.PR_NUMBER;
            if (!/^[1-9]\d*$/.test(input)) {
              throw new Error('PR number must be a positive integer.');
            }
            const pull_number = Number(input);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.base.repo.full_name !== `${owner}/${repo}` ||
                pr.base.ref !== 'main' || pr.state !== 'open' || pr.draft) {
              core.notice('Skipping: only open, non-draft PRs targeting main are reviewed.');
              return;
            }

            const marker = `<!-- codex-main-auto-review:${pr.head.sha} -->`;
            const { data: requester } = await github.rest.users.getAuthenticated();
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100
            });
            if (comments.some(comment => comment.user?.login === requester.login &&
                                        comment.body?.includes(marker))) {
              core.notice('Codex review has already been requested for this head commit.');
              return;
            }
            const { data: comment } = await github.rest.issues.createComment({
              owner, repo, issue_number: pull_number,
              body: `${marker}\n@codex review\n\nReview this main PR for actionable correctness and regression issues. Report findings in Japanese. Review only; do not modify code, approve, or merge the PR.`
            });
            core.notice(`Requested Codex review: ${comment.html_url}`);
            await core.summary.addLink('Codex review request', comment.html_url).write();
