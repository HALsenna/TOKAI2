<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171f2b; }
    #player { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: white;
      background: #171f2b; font: 18px sans-serif; padding: 24px; text-align: center; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="player"><canvas id="unity-canvas" tabindex="-1" aria-label="大脱獄ゲーム"></canvas></main>
  <div id="status" role="status">読み込み中…</div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    function showError(message) { status.hidden = false; status.textContent = '起動できませんでした。' + message; }
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onerror = () => showError('通信を確認して再読み込みしてください。');
    loader.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
      memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (message, type) => { if (type === 'error') showError(message); }
    }, progress => { status.textContent = '読み込み中… ' + Math.round(progress * 100) + '%'; })
      .then(() => { status.hidden = true; canvas.focus(); })
      .catch(error => showError(String(error)));
    document.body.appendChild(loader);
  </script>
</body>
</html>
